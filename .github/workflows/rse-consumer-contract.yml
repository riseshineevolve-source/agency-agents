name: RSE Consumer Contract

on:
  push:
    paths:
      - 'scripts/validate-rse-consumer-contract.py'
      - 'scripts/test-rse-consumer-contract.py'
      - 'scripts/test-rse-consumer-security-boundaries.py'
      - 'scripts/test-rse-consumer-privacy-lifecycle.py'
      - 'scripts/test-rse-consumer-supabase-policy-contract.py'
      - 'orchestration/architecture/RSE_CONSUMER_SYNTHETIC_DATA_CONTRACT_V0.md'
      - 'orchestration/architecture/RSE_CONSUMER_ENTITLEMENT_MODEL_V0.md'
      - 'orchestration/architecture/RSE_CONSUMER_AUTHORIZATION_MATRIX_V0.md'
      - 'orchestration/architecture/RSE_OFFLINE_SYNC_CONFLICT_POLICY_V0.md'
      - 'orchestration/architecture/RSE_CONSUMER_PRIVACY_LIFECYCLE_V0.md'
      - 'orchestration/architecture/RSE_CONSUMER_SUPABASE_RLS_POLICY_MAP_V0.md'
      - 'orchestration/architecture/RSE_CONSUMER_SUPABASE_SQL_TEST_PLAN_V0.md'
      - 'orchestration/architecture/fixtures/consumer-platform-v0/**'
      - '.github/workflows/rse-consumer-contract.yml'
  pull_request:
    paths:
      - 'scripts/validate-rse-consumer-contract.py'
      - 'scripts/test-rse-consumer-contract.py'
      - 'scripts/test-rse-consumer-security-boundaries.py'
      - 'scripts/test-rse-consumer-privacy-lifecycle.py'
      - 'scripts/test-rse-consumer-supabase-policy-contract.py'
      - 'orchestration/architecture/RSE_CONSUMER_SYNTHETIC_DATA_CONTRACT_V0.md'
      - 'orchestration/architecture/RSE_CONSUMER_ENTITLEMENT_MODEL_V0.md'
      - 'orchestration/architecture/RSE_CONSUMER_AUTHORIZATION_MATRIX_V0.md'
      - 'orchestration/architecture/RSE_OFFLINE_SYNC_CONFLICT_POLICY_V0.md'
      - 'orchestration/architecture/RSE_CONSUMER_PRIVACY_LIFECYCLE_V0.md'
      - 'orchestration/architecture/RSE_CONSUMER_SUPABASE_RLS_POLICY_MAP_V0.md'
      - 'orchestration/architecture/RSE_CONSUMER_SUPABASE_SQL_TEST_PLAN_V0.md'
      - 'orchestration/architecture/fixtures/consumer-platform-v0/**'

permissions:
  contents: read

jobs:
  validate-consumer-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate canonical synthetic consumer fixture
        run: python scripts/validate-rse-consumer-contract.py orchestration/architecture/fixtures/consumer-platform-v0/synthetic_consumer.valid.json
      - name: Run identity and entitlement fail-closed tests
        run: python scripts/test-rse-consumer-contract.py
      - name: Run authorization and offline sync boundary tests
        run: python scripts/test-rse-consumer-security-boundaries.py
      - name: Run privacy lifecycle and account-linking tests
        run: python scripts/test-rse-consumer-privacy-lifecycle.py
      - name: Run Supabase RLS policy-map contract tests
        run: python scripts/test-rse-consumer-supabase-policy-contract.py
