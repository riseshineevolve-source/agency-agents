name: Test Installer

on:
  workflow_dispatch:

# Owner-authorized budget containment: manual gates only; local checks remain required.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-install:
    name: install.sh behavior (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # macOS ships bash 3.2, Linux ships bash 5 — the scripts must pass on both.
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done

      - name: Run installer tests
        run: |
          chmod +x scripts/test-install.sh scripts/install.sh
          ./scripts/test-install.sh
