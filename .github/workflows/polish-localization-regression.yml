name: Polish Localization Regression

on:
  pull_request:
    paths:
      - "localization/pl-PL/**"
      - "scripts/validate-polish-localization.py"
      - "scripts/localization/**"
      - "scripts/localization-engine.py"
      - "scripts/test-localization-*.py"
      - "scripts/create-gentle-steps-r5-evidence-draft.py"
      - "scripts/validate-gentle-steps-r5-fit-evidence.py"
      - "orchestration/detective/DETECTIVE_ACADEMY_BOOK1_TEXT_GOLD_MASTER_V3.md"
      - ".github/workflows/polish-localization-regression.yml"
  push:
    branches:
      - main
      - "rse/polish-localization-engine-v1"
    paths:
      - "localization/pl-PL/**"
      - "scripts/validate-polish-localization.py"
      - "scripts/localization/**"
      - "scripts/localization-engine.py"
      - "scripts/test-localization-*.py"
      - "scripts/create-gentle-steps-r5-evidence-draft.py"
      - "scripts/validate-gentle-steps-r5-fit-evidence.py"
      - "orchestration/detective/DETECTIVE_ACADEMY_BOOK1_TEXT_GOLD_MASTER_V3.md"
      - ".github/workflows/polish-localization-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML input support
        run: python -m pip install -r scripts/localization/requirements.txt

      - name: Validate canonical terminology documentation
        run: python scripts/localization-engine.py terms-doc --check

      - name: Guard Detective V3 candidate source and case apparatus
        run: python scripts/localization-engine.py detective-v3-guard --receipt localization/pl-PL/engine/detective-freeze.example.json

      - name: Test localization contracts and adversarial mutations
        run: python scripts/test-localization-engine.py

      - name: Test bilingual backcheck provenance contract
        run: python scripts/test-localization-backcheck.py

      - name: Test native Polish re-authoring source isolation and gates
        run: python scripts/test-localization-reauthoring.py

      - name: Test Gentle Steps PL R5 exact-source fit evidence guards
        run: python scripts/test-localization-gentle-steps-r5-fit.py

      - name: Validate all authorized fixtures and generate QA packages
        run: python scripts/test-localization-fixtures.py

      - name: Keep bounded fixture QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localization-fixture-proof
          path: build/localization-proof
          if-no-files-found: error
