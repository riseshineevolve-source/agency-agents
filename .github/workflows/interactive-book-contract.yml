name: Interactive Book Contract

on:
  push:
    paths:
      - 'scripts/validate-interactive-book-pack.py'
      - 'scripts/test-interactive-book-validator.py'
      - 'scripts/validate-world01-pilot-provenance.py'
      - 'scripts/test-world01-pilot-provenance.py'
      - 'orchestration/architecture/RSE_INTERACTIVE_BOOK_CONTENT_CONTRACT_V0.md'
      - 'orchestration/architecture/fixtures/interactive-book/**'
      - 'orchestration/content-packs/world01/**'
      - 'orchestration/content-sources/world01-paperback-opener-evidence.json'
      - '.github/workflows/interactive-book-contract.yml'
  pull_request:
    paths:
      - 'scripts/validate-interactive-book-pack.py'
      - 'scripts/test-interactive-book-validator.py'
      - 'scripts/validate-world01-pilot-provenance.py'
      - 'scripts/test-world01-pilot-provenance.py'
      - 'orchestration/architecture/RSE_INTERACTIVE_BOOK_CONTENT_CONTRACT_V0.md'
      - 'orchestration/architecture/fixtures/interactive-book/**'
      - 'orchestration/content-packs/world01/**'
      - 'orchestration/content-sources/world01-paperback-opener-evidence.json'

permissions:
  contents: read

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate canonical synthetic fixture
        run: python scripts/validate-interactive-book-pack.py orchestration/architecture/fixtures/interactive-book/synthetic_world.valid.json
      - name: Run fail-closed regression suite
        run: python scripts/test-interactive-book-validator.py
      - name: Validate bounded World 01 candidate against v0 contract
        run: python scripts/validate-interactive-book-pack.py orchestration/content-packs/world01/mission-openers.en.candidate.json
      - name: Validate published-source evidence boundary
        run: python scripts/validate-world01-pilot-provenance.py
      - name: Run published-source provenance regression suite
        run: python scripts/test-world01-pilot-provenance.py
